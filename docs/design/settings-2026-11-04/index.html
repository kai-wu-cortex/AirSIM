const icon=(name,cls='ico')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[name]||icons.info}"/></svg>`;

let state,screenID='home',stack=[],journeyID='daily',busy=false,operation=0,drafts={},dark=false,large=false;
const initial=()=>({scenario:'ready',paired:true,local:false,localPending:false,mode:'自动',notifications:true,copyCode:false,standby:false,island:true,forward:false,forwardSaved:false,verbose:false,tls:false,appearance:'跟随系统',lastCheck:null,checkType:'云端',order:['Redmi 9','Galaxy'],pinned:false});
const offline=()=>state.scenario==='offline', failed=()=>state.scenario==='failure', calling=()=>state.scenario==='calling';
const row=(label,target='',value='',ic='',sub='',extra='')=>`<button class="row" ${target?`onclick="go('${target}')"`:''} ${extra}>${ic?icon(ic):''}<span class="row-text">${label}${sub?`<small>${sub}</small>`:''}</span>${value?`<span class="value">${value}</span>`:''}${target?icon('chevron','chev'):''}</button>`;
const act=(label,action,ic='',disabled=false)=>`<button class="row action ${/忘记|清除|取消蓝牙配对/.test(label)?'destructive':''}" onclick="${action}" ${disabled?'disabled':''}>${ic?icon(ic):''}<span class="row-text">${label}</span></button>`;

add('home','设置',null,'总览','一眼看懂当前状态，从六类入口找到功能。','纯本地滑块固定在首个卡片。连接状态与所选模式分开。长解释只在详情出现。',()=>`${card(`<div class="pad" style="padding:16px"><div class="slider-heading"><strong>纯本地模式</strong><button class="info" aria-label="纯本地模式说明" onclick="go('local')">${icon('info')}</button><span class="badge">${state.local?'已开启':'已关闭'}</span></div><div class="slide ${state.local?'on':''}"><span>${state.local?'向左滑动关闭':'向右滑动开启'}</span><input aria-label="滑动切换纯本地模式" type="range" min="0" max="100" value="${state.local?100:0}" onchange="slideLocal(this.value)" ${calling()?'disabled':''}></div>${state.localPending?note('本机已阻断 · 安卓待同步'):calling()?note('通话结束后可切换'):''}</div>`)}${card(state.paired?row('Redmi 9','device',status(),'device',`当前链路 · ${offline()?'等待恢复':'VoWLAN'}`):row('连接你的安卓手机','add','','plus','从一次配对开始'))}${group('常用设置',row('连接与设备','connections',state.mode,'wifi')+row('来电与短信','calls','','bell')+row('灵动岛与小组件','widgets','','widget'))}${card(row('外观与偏好','preferences',state.appearance,'sliders')+row('帮助与诊断','help','','help')+row('关于 AirSIM','about','0.9.8','info'))}`);
add('local','纯本地模式','home','总览','说明模式边界，避免把纯本地等同于禁止全部网络。','滑到底→立即显示处理中→成功状态；失败保留原设置。通话中禁止切换。离线时本机先阻断，安卓待同步。',()=>`${banner(state.local?'已阻断 AirSIM Relay':'当前允许按需使用 AirSIM Relay',state.local)}${group('开启后',label('Wi-Fi / 热点 / VPN 直连','仍可使用')+label('蓝牙通话','仍可使用')+label('云端通话与 APNs 注册','暂停')+label('云端自检与反馈上传','暂停'))}${note('不承诺后台或强制关闭 App 后仍能收到来电。VPN 直连不需要验证 Relay。GitHub 更新与安卓独立通知转发不由此开关控制。')}${primary(state.local?'关闭纯本地模式':'开启纯本地模式','setLocal()',calling())}${calling()?note('正在通话，请结束后再切换。'):''}`);
add('connections','连接与设备','home','连接','管理设备和连接入口。','更换模式不等于连接成功；在当前设备卡展示实际链路。',()=>`${card(row('通话连接方式','mode',state.mode,'sliders'))}${note('自动选择可用连接')}${group('我的设备',state.paired?row('Redmi 9','device',status(),'device','VoWLAN · 当前设备')+row('添加设备','add','','plus'):row('添加设备','add','','plus'))}${group('连接配置',row('局域网与 VPN','network','','wifi')+row('蓝牙连接','bluetooth','','bluetooth')+row('云端 Relay','relay',state.local?'已阻断':'','cloud')+row('公网域名直连','tls','试验性','shield'))}${card(row('检查连接','diagnostics','','help'))}`);
add('mode','通话连接方式','connections','连接','选适合自己的通话链路。','通话中不能改；纯本地时云端不可选，自动仅尝试本地。纯本地关闭时任何模式都可手动云端自检。',()=>`${state.local?banner('纯本地已开启：自动模式只尝试本地链路。'):''}${card([['自动','按可用性选择，推荐','wifi'],['VoWLAN+VoBLE','优先 Wi-Fi，其次蓝牙','wifi'],['VoWLAN','Wi-Fi、热点或 VPN 直连','wifi'],['蓝牙','通过蓝牙连接','bluetooth'],['云端','通过 Relay 连接','cloud']].map(([m,d,i])=>`<button class="row" onclick="chooseMode('${m}')" ${calling()||(state.local&&m==='云端')?'disabled':''}>${icon(i)}<span class="row-text">${m}<small>${d}</small></span>${state.mode===m?icon('check'):''}</button>`).join(''))}${note(calling()?'正在通话，结束后可切换。':'选中后生效；正在进行的通话不会自动更换音频链路。')}`);

add('deviceInfo','地址与配对信息','device','连接','只在需要排障时展示地址和身份。','掩码身份、证书与端口只在此页展示；不展示配对密钥。',()=>`${group('已保存的入口',label('局域网','192.168.2.86')+label('VPN','100.64.1.20')+label('控制 / 音频端口','7592 / 7593'))}${group('设备身份',label('标识','android…7a2f')+label('凭据','保存在系统钥匙串'))}${note('原型示例地址。真实应用优先使用已验证的可达地址，地址变化不等于设备身份变化。')}`);
add('add','添加设备','connections','配对','先选择连接条件，再进入对应配对表单。','共享一次性配对引导；不要求先配置 Relay。域名首次配对必须 TLS。',()=>`${note('先在安卓 AirSIM 打开“一次性配对”。')}${group('选择方式',row('同一 Wi-Fi / 热点','discover','','wifi','自动发现附近设备')+row('手动 IP / Tailscale','manual','','globe','填安卓的局域网或 VPN 地址')+row('蓝牙配对','bluetooth','','bluetooth','核对两端安全码')+row('公网域名配对','domainPair','试验性','shield','使用自己的 TLS 网关'))}${card(row('查看配对指南','guide','','book'))}`);
add('discover','发现安卓手机','add','配对','选择附近设备并完成一次性认证。','权限拒绝→系统权限指南；没有设备→重扫或手动地址。配对成功与网关可用必须分别展示。',()=>state.scenario==='permission'?`${banner('本地网络访问未允许。')}${primary('查看权限设置',"go('permissions')")}`:offline()?`${empty('没有发现设备','确认安卓已打开配对窗口，并连接相同 Wi-Fi 或热点。','manual','使用手动地址')}${secondary('重新扫描',"run('正在扫描…',()=>toast('仍未发现设备；可尝试手动 IP'))")}`:`${group('发现的设备',row('Redmi 9','pairCode','','device','附近 · 等待配对'))}${secondary('重新扫描',"run('正在扫描…',()=>toast('发现 Redmi 9'))")}${note('允许本地网络访问后，回到此页会继续发现。')}`);
add('pairCode','一次性配对','discover','配对','仅输入安卓当前配对窗口的六位数字。','输入不足不发送；验证码错误可原地改正；成功后继续验证控制及音频状态。',()=>`${group('Redmi 9',field('pairCode','六位配对码','输入安卓显示的数字','text'))}${errors()}${primary('连接并加密配对',"pair('local')")}${note('配对码过期时，在安卓重新打开配对窗口。')}`);
add('manual','手动地址配对','add','配对','支持 Wi-Fi、热点与 Tailscale / 其他 VPN。','填写安卓地址及本次配对端口；不是 iPhone 地址、ADB 端口。网络错误保留输入。',()=>`${card(field('host','安卓 IP 地址','192.168.2.86 或 100.64.1.20')+field('port','本次配对端口','安卓配对页显示的端口','text')+field('pairCode','六位配对码','六位数字'))}${errors()}${primary('连接并加密配对',"pair('ip')")}${note('VPN 两端需允许互访。填写安卓的地址，无需开启云端模式。')}${card(row('特殊私有网段','prefixes','','sliders'))}`);
add('domainPair','公网域名配对','add','配对','首次在公网完成安全配对。','显式试验性标记；三个端口各有职责；不能跳过证书校验。成功也不代表音频已验收。',()=>`${banner('试验性 · 需要自己的有效 TLS 网关')}${card(row('先看部署步骤','tlsGuide','','book'))}${card(field('host','域名','phone.example.com')+field('port','HTTPS 配对端口','9443')+field('control','HTTPS 控制端口','443')+field('pcm','TLS 音频端口','7593')+field('pairCode','六位配对码','六位数字'))}${errors()}${primary('验证并配对',"pair('tls')")}${note('仅支持可信证书；配对后关闭临时公网配对入口。')}`);
add('paired','配对结果','add','配对','给出认证结果和服务可用性两条独立结论。','配对成功但 PCM / 网关未就绪时，不显示“可通话”；不回退写入 Relay。',()=>`${banner('配对成功 · 设备已保存',true)}${group('下一步',label('设备身份','认证通过')+label('控制网关',offline()?'暂不可达':'可达')+label('音频服务',state.scenario==='bridge'?'尚未就绪':'等待实际通话验证'))}${(offline()||state.scenario==='bridge')?banner('已保存配对，但暂不能确认通话可用。请检查网络与安卓音频桥。'):note('认证完成不等于双向音频已验证；请由你手动进行通话测试。')}${primary('查看设备',"go('device')")}${secondary('检查连接',"go('diagnostics')")}`);
add('bluetooth','蓝牙连接','connections','配对','显示发现、连接、认证三个阶段。','蓝牙配对采用双方安全码确认；失败支持重试和明确的清凭据确认。',()=>`${banner(state.scenario==='permission'?'蓝牙权限未允许':'蓝牙已开启 · 等待选择设备',state.scenario!=='permission')}${state.scenario==='permission'?primary('查看权限设置',"go('permissions')"):group('附近设备',row('Redmi 9','sas','','bluetooth','可配对'))}${card(act('重新扫描',"run('正在扫描…',()=>toast('扫描完成'))",'refresh')+row('蓝牙连接检查','diagnostics','','help')+act('取消蓝牙配对',"confirmBluetooth()",'trash',calling()))}`);
add('sas','核对安全码','bluetooth','配对','让用户在两端确认同一设备。','数字不一致必须取消；认证完成前不开放拨号和音频。',()=>`${note('确认以下六位数字与安卓显示的一致。')}${card('<div class="code">123 456</div>')}${note('此处是设计演示码，不可用于真实配对。')}${primary('数字一致，完成配对',"run('正在完成认证…',()=>{state.paired=true;go('paired')})")}${secondary('不一致，取消配对',"back()")}`);
add('network','局域网与 VPN','connections','网络','只显示当前连接和两个必要入口。','普通用户不需要编辑 CIDR；Tailscale 默认支持。',()=>`${group('直连状态',label('VoWLAN',status())+row('当前设备地址','deviceInfo','','device'))}${card(row('添加或更新手动地址','manual','','globe')+row('自定义私有网段','prefixes','','sliders')+act('重新发现',"run('正在发现…',()=>toast('发现完成'))",'refresh'))}${note('Tailscale 100.64/10 已支持。纯本地时也可使用 VPN 直连。')}`);
add('prefixes','自定义私有网段','network','网络','少数特殊网络用户才进入。','校验 CIDR；拒绝无效或不允许的公网范围；失败留在当前页并保留输入。',()=>`${note('常见局域网和 Tailscale 网段无需添加。')}${card(field('prefix','附加网段','例如 30.0.0.0/8'))}${errors()}${primary('保存并重新发现',"savePrefix()")}${note('多个网段用逗号分隔。实际应用沿用现有允许范围校验。')}`);
add('relay','云端 Relay','connections','网络','连接方式与通知权限分开呈现。','纯本地关闭时任何通话模式都能手动自检；保存新地址不是注册成功。',()=>`${blocked()}${group('当前状态',label('通话方式',state.mode)+label('云端通知',state.local?'已暂停':state.notifications?'已开启':'已关闭')+label('最近自检',state.lastCheck||'尚未检查'))}${card(field('relay','Relay HTTPS 地址','https://relay.example.com'))}${errors()}${primary('验证并保存',"saveRelay()",state.local||calling())}${secondary('手动云端自检',"startCheck('云端')")}${note(state.local?'关闭纯本地后才允许访问 Relay。':'VoWLAN 或蓝牙通话不影响手动自检；云端通知在“来电与短信”中设置。')}`);
add('tls','公网域名直连','connections','网络','给已有配对设备添加 TLS 入口。','无设备先配对；通话中禁止修改；控制身份验证成功后保存，音频仍需实测。',()=>!state.paired?`${banner('试验性 · 尚未配对设备')}${primary('通过公网域名首次配对',"go('domainPair')")}`:`${banner('试验性 · 自建 TLS 网关')}${card(row('部署与使用教程','tlsGuide','','book')+label('设备','Redmi 9')+toggle('启用域名直连','tls','',calling()))}${state.tls?card(field('tlsHost','域名','phone.example.com')+field('control','HTTPS 控制端口','443')+field('pcm','TLS 音频端口','7593')):''}${errors()}${primary(state.tls?'验证并保存':'保存关闭',"saveTLS()",calling())}${note('需要独立的控制与音频转发。此功能本身不提供后台来电推送。')}`);
add('tlsGuide','域名直连教程','tls','网络','四步展示前提、配置、验证与常见问题。','教程与实际表单复用；原生页面可折叠展开，不要求用户记住协议细节。',()=>`${banner('试验性 · 需要可入站的网关与有效证书')}${group('部署步骤',row('1 · 准备安卓与网关','guideDetail','','device','启动 AirSIM 与音频桥')+row('2 · 配置 TLS 转发','guideDetail','','shield','分别配置配对、控制和音频入口')+row('3 · 完成认证与保存','domainPair','','check','首次配对；已有设备返回域名配置')+row('4 · 手动验证通话与短信','diagnostics','','help'))}${note('没有可入站公网入口时，可以使用 Tailscale。普通网页反向代理不等于音频转发。')}`);
add('calls','来电与短信','home','通知','只放和接收、短信体验有关的设置。','云端通知独立于通话模式；纯本地时禁用但不忘记原偏好。',()=>`${group('来电通知',toggle('云端通知','notifications','用于后台来电唤醒',state.local))}${state.local?note('纯本地模式已暂停云端通知。'):note('使用 VoWLAN 或蓝牙时也可以保留云端通知。')}${group('短信',toggle('自动复制验证码','copyCode','开启会覆盖当前剪贴板'))}${card(row('通知转发','forwarding',state.forward?'已开启':'未开启','send')+row('后台运行','background','','clock')+row('系统权限','permissions','','shield'))}`);
add('background','后台运行','calls','通知','解释保活耗电与系统限制。','保留现有设置，首次开启强调耗电；关闭不会关闭 PushKit。不要承诺强制退出后有来电。',()=>`${card(toggle('后台静音音频保活','standby','会明显增加耗电'))}${note('关闭后仍可通过已配置的 PushKit 唤醒；系统可能暂停后台轮询。保活不保证 App 被强制关闭后继续运行。')}${card(row('后台来电排查','diagnostics','','help'))}`);
add('forwarding','通知转发','calls','通知','展示目标列表及是否已发送到安卓。','保留现有“下次配对同步”行为；不能显示为即时远端生效。独立转发可能访问第三方服务。',()=>`${card(toggle('启用通知转发','forward'))}${note('安卓直接发送至第三方服务；不依赖 Relay。配置将在下次加密配对时同步。')}${state.forwardSaved?banner('已保存在本机 · 等待下次配对同步'):''}${group('转发目标',(state.forwardSaved?row('我的通知','forwardEditor','已保存','send'):'')+row('添加转发目标','forwardEditor','','plus'))}`);
add('forwardEditor','转发目标','forwarding','通知','按渠道渐进展示必要字段。','敏感信息不预填；保存不会发送测试短信。正文与号码发送范围明确。',()=>`${card(field('destinationName','名称','例如：我的通知')+`<label class="field">渠道<select id="channel" onchange="drafts.channel=this.value;render()">${['Bark','Discord','Slack','企业微信','飞书','Telegram','QQ','Webhook'].map(c=>`<option ${drafts.channel===c?'selected':''}>${c}</option>`).join('')}</select></label>`+field('webhook','Webhook URL','https://…')+(['Telegram','QQ'].includes(drafts.channel)?field('token','Bot Token','输入令牌','password')+field('chat','Chat ID / OpenID','输入目标标识'):drafts.channel==='飞书'?field('secret','签名 Secret（可选）','','password'):(!drafts.channel||drafts.channel==='Bark')?field('key','Device Key（可选）','','password'):''))}${group('转发内容',toggle('短信','sendSMS')+toggle('来电','sendCall')+toggle('未接来电','sendMissed')+toggle('包含短信正文','includeBody')+toggle('包含号码','includeNumber'))}${card(row('消息模板','templates','','log'))}${errors()}${primary('保存到本机',"saveForward()")}${secondary('取消',"discardBack()")}`);
add('templates','消息模板','forwardEditor','通知','高级自定义放在独立详情。','模板以草稿保留，最终随转发目标保存；返回不丢草稿。',()=>`${card(textarea('template','短信 / 来电格式','{event}\n{device}\n{content}')+textarea('missedTemplate','未接来电格式','{event}\n{number}\n{time}'))}${note('可用变量：{event} {device} {number} {sender} {content} {time}')}${primary('完成编辑',"back()")}`);

const journeys={daily:{title:'日常使用 · 找到常用设置',pages:['home','calls','widgets','preferences'],rule:'首页只留摘要与入口，长说明按需展开。'},pair:{title:'首次使用 · 自动发现配对',pages:['home','connections','add','discover','pairCode','paired','device'],rule:'开启安卓配对窗口 → 输入六位码 → 身份认证 → 单独验证网关和音频。'},vpn:{title:'外网 / VPN · 手动配对',pages:['home','connections','add','manual','paired','network'],rule:'用安卓 IP 和配对端口；同一隧道不代表所有端口都可达；不需要 Relay。'},bt:{title:'蓝牙 · 双方安全码确认',pages:['connections','bluetooth','sas','paired'],rule:'设备发现与安全码确认是两步，数字不一致就取消。'},local:{title:'纯本地 · 开启与限制',pages:['home','local','mode','relay','feedback'],rule:'开启即阻断 AirSIM Relay；检查、上传给出受限说明；关闭后按原偏好恢复。'},cloud:{title:'云端排障 · 自检到恢复',pages:['home','help','result','checkDetail','relay','result'],rule:'诊断不是通话模式。纯本地关闭时 VoWLAN / 蓝牙 / 双通道都可以运行云端自检。'},tls:{title:'试验性 · 域名首次配对',pages:['connections','add','domainPair','tlsGuide','paired','tls'],rule:'有效 TLS 证书、三个入口、身份认证；临时配对入口用完关闭，音频另行验收。'},notification:{title:'通知转发 · 配置与同步',pages:['calls','forwarding','forwardEditor','templates','forwarding'],rule:'保存本机草稿 → 标明等待下次配对同步。第三方转发独立于 Relay。'},widget:{title:'展示 · 小组件与灵动岛',pages:['home','widgets','order','widgetGuide','islandGuide'],rule:'调整显示顺序不切换通话设备；过期不等同于离线。'},feedback:{title:'故障反馈 · 手动且可恢复',pages:['help','diagnostics','result','logs','feedback','feedbackPreview'],rule:'先诊断，按需读取日志，检查上传范围，手动上传；失败留住草稿。'},remove:{title:'设备管理 · 安全移除',pages:['connections','device','deviceInfo','device'],rule:'选择忘记 → 说明清除范围 → 删除或取消。无需清除系统短信。'},update:{title:'更新 · 了解与检查版本',pages:['about','notes','update'],rule:'真实渠道决定更新方式；版本检查不受纯本地开关限制。'}};
function render(){const p=pages[screenID];document.getElementById('screen').className='screen '+(screenID==='home'?'home':'');document.getElementById('screen').innerHTML=(screenID==='home'?`<div class="hero"><h2>设置</h2><div class="logo">${icon('phone')}</div></div>`:`<nav class="nav"><button class="back" onclick="back()" aria-label="返回">${icon('back')}返回</button><strong>${p.title}</strong></nav>`)+`<div class="content">${p.render()}</div>`;document.querySelector('#phone > .tabs')?.remove();if(screenID==='home')document.getElementById('phone').insertAdjacentHTML('beforeend',tabs());document.getElementById('phone').classList.toggle('dark-phone',dark);document.getElementById('phone').classList.toggle('large-type',large);document.getElementById('path').textContent=ancestry(screenID).map(id=>pages[id].title).join(' › ');document.getElementById('spec').innerHTML=`<h2>${p.title}</h2><span class="badge">L${ancestry(screenID).length-1} · ${p.category}</span><p>${p.goal}</p><h2>交互约定</h2><p>${p.rule}</p><span class="meta">演示使用页面跳转、轻提示及确认面板。不会访问真实服务。</span>`;document.getElementById('sitemap').innerHTML='<h2>完整页面地图 · '+Object.keys(pages).length+' 页</h2>'+[...new Set(Object.values(pages).map(p=>p.category))].map(c=>`<div class="group-title">${c}</div>`+Object.values(pages).filter(p=>p.category===c).map(p=>`<button class="navitem ${p.id===screenID?'active':''}" data-page="${p.id}" onclick="go('${p.id}')"><small>L${ancestry(p.id).length-1}</small>${p.title}</button>`).join('')).join('');renderSteps()}
function ancestry(id){const a=[];while(id){a.unshift(id);id=pages[id].parent}return a}
function tabs(){return '<div class="tabs">'+[['phone','拨号'],['clock','最近'],['message','短信'],['contacts','联系人'],['sliders','设置']].map(([i,t])=>`<div class="${t==='设置'?'selected':''}">${icon(i)}${t}</div>`).join('')+'</div>'}
function go(id){if(!pages[id])throw Error('Unknown route: '+id);operation++;busy=false;document.getElementById('overlays').innerHTML='';if(screenID!==id)stack.push(screenID);screenID=id;render();document.getElementById('screen').scrollTop=0}
function back(){const id=stack.pop()||pages[screenID].parent||'home';operation++;busy=false;document.getElementById('overlays').innerHTML='';screenID=id;render();document.getElementById('screen').scrollTop=0}
let toastTimer;function toast(t){clearTimeout(toastTimer);document.getElementById('overlays').innerHTML=`<div class="toast" role="status">${t}</div>`;toastTimer=setTimeout(()=>document.getElementById('overlays').innerHTML='',3000)}
function sheet(title,body,actions){document.getElementById('overlays').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="grabber"></div><h3>${title}</h3><p>${body}</p>${actions}<button class="secondary" onclick="closeSheet()">取消</button></section></div>`;document.querySelector('.sheet button')?.focus()}
function closeSheet(){document.getElementById('overlays').innerHTML=''}
function run(message,done){if(busy)return;busy=true;const op=++operation;toast(message);setTimeout(()=>{if(op!==operation)return;busy=false;done()},850)}
function error(t){document.getElementById('formError')?.replaceChildren(document.createTextNode(t))}function clearError(){const e=document.getElementById('formError');if(e)e.textContent=''}
function flip(key){if(key==='notifications'&&state.local)return;if(key==='standby'&&!state.standby){sheet('开启后台保活？','会增加耗电，也不能保证强制退出后保持运行。',primary('开启',"state.standby=true;closeSheet();render()"));return}state[key]=!state[key];render();toast('设置已更新（演示）')}
function slideLocal(v){if((!state.local&&v>=78)||(state.local&&v<=22))setLocal();else render()}
function setLocal(){if(calling()){toast('请结束通话后再切换');return}run('正在更新纯本地设置…',()=>{if(failed()){render();toast('未能同步设置，保留原状态');return}state.local=!state.local;state.localPending=state.local&&offline();if(state.local&&state.mode==='云端'){state.priorMode=state.mode;state.mode='自动'}else if(!state.local&&state.priorMode){state.mode=state.priorMode;delete state.priorMode}render();toast(state.localPending?'本机已阻断，安卓待同步':state.local?'纯本地模式已开启':'纯本地已关闭，按原设置恢复')})}
function chooseMode(m){if(calling()||(state.local&&m==='云端'))return;state.mode=m;render();toast('已选择 '+m+'；连接状态单独更新')}
function pair(type){if(!/^\d{6}$/.test(drafts.pairCode||'')){error('请输入安卓当前显示的六位配对码。');return}if(type!=='local'&&(!(drafts.host||'').trim()||!validPort(drafts.port))){error('请填写有效地址和 1–65535 的配对端口。');return}if(type==='tls'&&(!validDomain(drafts.host)||!validPort(drafts.control)||!validPort(drafts.pcm))){error('填写有效域名与控制 / 音频端口，不含协议或路径。');return}if(type==='ip'&&!validIP(drafts.host)){error('请输入安卓的 IPv4 地址。');return}run('正在连接并验证设备身份…',()=>{if(failed()){error('配对失败：请检查配对码是否过期，输入已保留。');toast('未保存新配对');return}state.paired=true;drafts.pairCode='';go('paired')})}
const validPort=v=>/^\d+$/.test(v||'')&&Number(v)>0&&Number(v)<=65535;const validIP=v=>/^(\d{1,3}\.){3}\d{1,3}$/.test(v||'')&&v.split('.').every(n=>Number(n)<=255);const validDomain=v=>/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/i.test(v||'');
function savePrefix(){if(!(drafts.prefix||'').split(',').every(s=>{const [ip,b]=s.trim().split('/');return validIP(ip)&&/^\d{1,2}$/.test(b||'')&&Number(b)<=32})){error('网段格式无效，例如 30.0.0.0/8。');return}run('正在保存…',()=>failed()?error('保存失败，输入已保留。'):toast('已模拟保存并重新发现；正式版还会验证允许范围'))}
function saveRelay(){if(state.local||calling())return;try{const u=new URL(drafts.relay);if(u.protocol!=='https:'||u.username||u.password)throw Error()}catch{error('请输入不含账号密码的 HTTPS Relay 地址。');return}run('正在验证 Relay…',()=>{if(failed()||offline()){error('未能验证新地址，继续使用原配置。');return}toast('地址已保存，设备注册状态另行检查')})}
function saveTLS(){if(calling())return;if(state.tls&&(!validDomain(drafts.tlsHost)||!validPort(drafts.control)||!validPort(drafts.pcm))){error('填写有效域名及两个 TLS 端口。');return}run('正在验证控制入口与设备身份…',()=>{if(failed()){error('验证失败，旧配置保留；不能跳过证书校验。');return}toast(state.tls?'控制身份验证通过，音频仍待实测':'已关闭域名直连')})}
function saveForward(){if(!(drafts.webhook||'').startsWith('https://')&&!['Telegram','QQ'].includes(drafts.channel)){error('请输入 HTTPS 目标地址。');return}if(['Telegram','QQ'].includes(drafts.channel)&&(!drafts.token||!drafts.chat)){error('填写 Bot Token 与目标 ID。');return}if(failed()){error('保存失败，草稿保留。');return}state.forwardSaved=true;go('forwarding');toast('已保存本机，等待下次配对同步')}
function discardBack(){sheet('放弃本次编辑？','未保存的转发目标改动将丢弃。',primary('放弃编辑',"drafts={};closeSheet();back()"))}
function confirmForget(){sheet('忘记 Redmi 9？','清除本机配对、绑定和设备缓存；通话、短信记录保留。此设备需重新配对，离线设备的远端凭据不会自动撤销。',primary('忘记此设备',"state.paired=false;closeSheet();go('connections')"))}
function confirmBluetooth(){sheet('取消蓝牙配对？','尝试删除两端蓝牙凭据；离线时需在安卓手动检查。VoWLAN 与云端配置不受影响。',primary('取消配对',"closeSheet();toast('已模拟取消蓝牙配对')"))}
function confirmClear(){sheet('清除本机日志？','不会删除安卓日志、短信或通话记录。',primary('清除本机日志',"closeSheet();toast('本机日志已模拟清除')"))}
function exportSheet(){sheet('导出调试日志','原始日志可能包含号码、短信和设备标识。分享前检查内容。',primary('预览导出内容',"closeSheet();go('logDetail')"))}
function systemSheet(text){sheet('系统 / 外部页面',text+'。这是交互占位，不会真的离开此原型。',primary('返回 AirSIM',"closeSheet()"))}
function pinDevice(i){if(i===0&&state.pinned){state.pinned=false;render();toast('已取消置顶');return}const d=state.order.splice(i,1)[0];state.order.unshift(d);state.pinned=true;render();toast('显示顺序已更新')}
function moveDevice(i,delta){const j=i+delta;if(j<0||j>=state.order.length)return;if(state.pinned&&(i===0||j===0)){toast('请先取消置顶再移动');return}[state.order[i],state.order[j]]=[state.order[j],state.order[i]];render()}
function startCheck(type){if(type==='云端'&&state.local){toast('纯本地模式已阻断云端自检');return}state.checkType=type;run('正在检查'+type+'连接…',()=>{state.lastCheck=(offline()||failed()||(state.scenario==='bridge'&&type!=='云端')||state.scenario==='permission'||!state.paired)?'未通过':'通过';go('result')})}
function checkFailureIndex(){return state.scenario==='permission'?0:!state.paired?2:state.scenario==='bridge'&&state.checkType!=='云端'?3:offline()?1:state.checkType==='云端'?3:2}
function checkSteps(){return state.checkType==='云端'?['本机 Push 凭据','Relay 身份与连通性','设备注册','Agent 记录与心跳','命令路由']:state.checkType==='蓝牙'?['蓝牙权限','设备发现','设备身份认证','PCM 状态']:['本地网络权限','控制地址可达性','设备身份认证','PCM 服务状态']}
function uploadFeedback(){if(state.local)return;run('正在整理脱敏信息并上传…',()=>{if(failed()||offline()){error('上传失败，草稿已保留。你可以稍后手动重试。');return}toast('反馈已模拟上传；无真实数据发送')})}
function togglePreview(key){if(key==='dark')dark=!dark;else large=!large;render()}
function changeScenario(v){operation++;busy=false;state.scenario=v;state.paired=v!=='empty';if(v==='empty')screenID='home';render()}
function selectJourney(id){journeyID=id;const j=journeys[id];if(id==='pair'){state.scenario='empty';state.paired=false}else{state.scenario='ready';state.paired=true}document.getElementById('scenario').value=state.scenario;stack=[];screenID=j.pages[0];render()}
function renderSteps(){const j=journeys[journeyID];document.getElementById('steps').innerHTML=j.pages.map((id,i)=>`<button class="step ${id===screenID?'active':''}" onclick="go('${id}')"><span class="n">${i+1}</span>${pages[id].title}</button>`).join('');document.getElementById('journeyRule').textContent=j.rule}
function showView(v){document.getElementById('layout').classList.toggle('hidden',v==='gallery');document.getElementById('gallery').classList.toggle('hidden',v!=='gallery');document.getElementById('galleryButton').classList.toggle('active',v==='gallery');document.getElementById('prototypeButton').classList.toggle('active',v!=='gallery');if(v==='gallery')renderGallery()}
function renderGallery(ids=Object.keys(pages)){document.getElementById('gallery').innerHTML=ids.map(id=>{const p=pages[id];return `<article class="gallery-item" data-gallery="${id}" onclick="showView('prototype');go('${id}')"><h3>${p.title}</h3><small>L${ancestry(id).length-1} · ${p.goal}</small><div class="phone"><div class="status"><span>9:41</span><i class="island"></i><span>▂▅▇ ▰</span></div><div class="screen ${id==='home'?'home':''}">${id==='home'?'<div class="hero"><h2>设置</h2></div>':`<div class="nav"><span class="back">‹ 返回</span><strong>${p.title}</strong></div>`}<div class="content">${p.render()}</div></div>${id==='home'?tabs():''}<div class="home-indicator"></div></div></article>`}).join('')}
function resetDemo(){operation++;busy=false;state=initial();state.sendSMS=true;state.sendCall=true;state.sendMissed=true;state.includeBody=false;state.includeNumber=false;drafts={};stack=[];screenID='home';journeyID='daily';dark=false;large=false;document.getElementById('scenario').value='ready';document.getElementById('journey').value='daily';closeSheet();showView('prototype');render()}
document.getElementById('logo').innerHTML=icon('phone');document.getElementById('journey').innerHTML=Object.entries(journeys).map(([k,j])=>`<option value="${k}">${j.title}</option>`).join('');document.addEventListener('keydown',e=>{if(e.key==='Tab'&&document.querySelector('.sheet')){const items=[...document.querySelectorAll('.sheet button:not(:disabled),.sheet input,.sheet textarea')];if(items.length){if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}}if(e.key==='Escape'){if(document.querySelector('.scrim'))closeSheet();else back()}});resetDemo();window.demo={pages,journeys,go,reset:resetDemo,getState:()=>state};
</script></html>
