name: Build AVF Agent release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Agent version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: module/module-agent/go.mod
          cache-dependency-path: |
            module/module-agent/go.sum
            module/avf-installerd/go.mod

      - name: Validate release input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_VERSION" in
            ''|*[!0-9A-Za-z.+:~_-]*)
              echo "Invalid release version" >&2
              exit 2
              ;;
          esac

      - name: Test Agent and installer
        run: |
          (cd module/module-agent && go test ./...)
          (cd module/avf-installerd && go test ./...)
          ./module/packaging/test.sh

      - name: Build signed Debian package
        env:
          AIRSIM_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.AIRSIM_RELEASE_PRIVATE_KEY_PEM }}
          AIRSIM_PACKAGE_VERSION: ${{ inputs.version }}
          AIRSIM_PACKAGE_RELEASE: "1"
          EXPECTED_RELEASE_PUBLIC_KEY_BASE64: QQPJXjO2mcx13qhv74lXen8ytjJZ2hMCz+ERlz6w5qg=
        run: |
          if [ -z "$AIRSIM_RELEASE_PRIVATE_KEY_PEM" ]; then
            echo "AIRSIM_RELEASE_PRIVATE_KEY_PEM is unavailable" >&2
            exit 3
          fi
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s' "$AIRSIM_RELEASE_PRIVATE_KEY_PEM" > "$key_file"
          actual_public=$(openssl pkey -in "$key_file" -pubout -outform DER             | tail -c 32 | base64 -w0)
          if [ "$actual_public" != "$EXPECTED_RELEASE_PUBLIC_KEY_BASE64" ]; then
            echo "Release private key does not match the published v0.4.5 trust root" >&2
            exit 4
          fi
          AIRSIM_DIST_DIR="$RUNNER_TEMP/airsim-avf-release"           AIRSIM_RELEASE_PUBLIC_KEY_BASE64="$EXPECTED_RELEASE_PUBLIC_KEY_BASE64"           AIRSIM_RELEASE_PRIVATE_KEY="$key_file"             ./module/packaging/build-avf-deb.sh
          mkdir -p release-assets
          cp "$RUNNER_TEMP/airsim-avf-release"/* release-assets/

      - name: Upload signed release assets
        uses: actions/upload-artifact@v4
        with:
          name: airsim-avf-agent-${{ inputs.version }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
