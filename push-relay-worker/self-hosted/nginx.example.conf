# Install only after DNS, certificate and applicable ICP filing are ready.
# Put map at http{} scope, server at http{} scope. TLS termination is mandatory.
map $http_upgrade $airsim_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name airsim-ecs.remotepilot.site;
    ssl_certificate /etc/airsim-relay/tls/fullchain.pem;
    ssl_certificate_key /etc/airsim-relay/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    # Query strings may contain call tokens. Do not enable the default access log.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $airsim_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
    }
}
